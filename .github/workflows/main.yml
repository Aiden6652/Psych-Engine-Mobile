name: Psych Engine 0.6.3 移动端构建（iOS + 安卓）

on:
  push:
    branches: [ main ]
    # 只在这些路径变更时触发。
    # ⚠ 没有这个过滤 + 下面的 concurrency，批量同步文件会把队列刷爆
    #   （每推一个文件 = 一次 commit = 一次完整 iOS+Android 构建）。
    paths:
      - 'source/**'
      - 'Project.xml'
      - 'hmm.json'
      - '.github/workflows/**'
      - 'assets/**'
      - 'example_mods/**'
  workflow_dispatch:

# 同一分支只保留最新一次运行，旧的自动取消。
# 这是「批量推送刷屏」的根治办法：连推 10 个文件，只会留下最后那次。
concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: iOS 构建（macOS 14）
    runs-on: macos-14
    timeout-minutes: 300
    env:
      HAXELIB_ROOT: ${{ github.workspace }}/_haxelib
      # hxcpp 按「源文件内容 + 编译参数」的哈希缓存每个 .o。
      HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp-cache

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 恢复仓库自带的素材（assets / example_mods）
        run: |
          set -Eeuo pipefail
          rm -rf assets resources.zip assets/preload/resources.zip mods
          git checkout -f HEAD -- assets
          git checkout -f HEAD -- example_mods
          echo "assets 文件数: $(find assets -type f | wc -l)"

      - name: 修补 Lua：错误的 setProperty 不再让游戏崩溃（只记日志）
        run: |
          set -Eeuo pipefail
          python3 tools/patch_lua_guard.py
          grep -c "LuaGuard" source/FunkinLua.hx || true

      - name: 打包内置资源 resources.zip（只放 assets，不放 mods）
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/pack
          mkdir -p /tmp/pack/assets

          # 解压后必须是 <Documents>/assets/<...>（例如 assets/music/freakyMenu.ogg），
          # 不能多一层 preload。运行时 Paths.getPath()/returnSound() 全按 assets/… 找文件。
          # 仓库里这些资源放在 assets/preload/ 下（OpenFL 的资源前缀），
          # 所以要打 zip 时把 preload 里的内容平移到 assets/ 根下。
          cp -R assets/preload/. /tmp/pack/assets/
          # 字体在 assets/fonts（不在 preload 里），运行时按 assets/fonts/… 读，也要带上
          if [ -d assets/fonts ]; then cp -R assets/fonts /tmp/pack/assets/fonts; fi

          # ❗ 刻意不打包 example_mods！
          # 之前把它当作 mods/ 一起解压，会导致：删掉重装后内置解压出一套
          # 「只有 readme + pack.json 的空模组」，用户再放入自己的 mods 时就变成两套混合，
          # 引擎可能把那个空模组当模组加载 → 直接崩。
          # 现在 mods 目录改由 SUtil.ensureAssets() 解压后创建（空气泡即可），
          # 用户的 mods 永远是干净的。

          ( cd /tmp/pack && zip -qry /tmp/resources.zip assets )
          mkdir -p assets/preload
          mv /tmp/resources.zip assets/preload/resources.zip
          ls -lh assets/preload/resources.zip
          echo "### zip 内容抽样（应只有 assets/…，确认没有 preload 层也没有 mods）###"
          unzip -l assets/preload/resources.zip | head -12
          echo "### 确认 zip 里没有 mods ###"
          if unzip -l assets/preload/resources.zip | grep -qE '^\s+[0-9]+\s+[0-9-]+\s+[0-9:]+\s+mods/'; then
            echo "::error::resources.zip 里不应包含 mods，请检查打包步骤"
            exit 1
          fi
          echo "OK：zip 内无 mods"

      - name: 缓存 haxelib 依赖库
        uses: actions/cache@v4
        with:
          path: _haxelib
          key: psych063-haxelib-v14
          restore-keys: |
            psych063-haxelib-

      - name: 缓存 hxcpp 编译产物（提速关键）
        uses: actions/cache@v4
        with:
          path: .hxcpp-cache
          key: hxcpp-cache-haxe424-v2
          restore-keys: |
            hxcpp-cache-haxe424-

      - name: 安装 Haxe 4.2.4（pkg 版，自带 neko）
        run: |
          set -Eeuo pipefail
          curl -fL --retry 5 --retry-delay 5 https://github.com/HaxeFoundation/haxe/releases/download/4.2.4/haxe-4.2.4-osx-installer.pkg -o haxe.pkg
          SZ=$(wc -c < haxe.pkg | tr -d ' ')
          if [ "$SZ" -lt 1000000 ]; then echo "下载异常"; exit 1; fi
          sudo installer -pkg haxe.pkg -target /
          haxe -version

      - name: 配置 haxelib 仓库路径
        run: |
          set -Eeuo pipefail
          mkdir -p "$HAXELIB_ROOT"
          haxelib setup "$HAXELIB_ROOT"
          mkdir -p "$HXCPP_COMPILE_CACHE"
          du -sh "$HXCPP_COMPILE_CACHE" 2>/dev/null || true

      - name: 安装项目依赖（Haxe 库）
        run: |
          set -Eeuo pipefail
          haxelib git lime https://github.com/PsychEngine-report/LIME-0.6.3-FIX main
          haxelib install openfl 9.1.0 --always
          haxelib install flixel 4.11.0 --always
          haxelib install flixel-addons 2.11.0 --always
          haxelib install flixel-ui 2.4.0 --always
          haxelib install hscript 2.4.0 --always
          haxelib git hxcpp https://github.com/kittycathy233/hxcpp main

          # hxvlc 版本选择（反复踩坑后的结论）：
          #   * 1.7 / 1.8.x：没有 GPU 渲染路径（bitmap.forceRendering / 纹理）
          #     → 表现为「有声音、画面出不来」；
          #   * 1.9.4+ / 2.x：用了 Haxe 4.3 的 `?.` 安全导航语法 → Haxe 4.2.4 语法报错；
          #   * 1.9.3：既有 forceRendering，又是 if(bitmap != null) 写法，发布在
          #     2024-06-30 PR #57（android/ios libs include visual module）之后 → 正好可用。
          echo "## hxvlc 1.9.3（curl 断点续传 + 本地离线安装）"
          # 说明同安卓侧：hxvlc 的 zip 有 212MB，haxelib 自带下载器会中途断流。
          HXVLC_ZIP="$RUNNER_TEMP/hxvlc-1.9.3.zip"
          HXVLC_URL="https://lib.haxe.org/files/3.0/hxvlc-1,9,3.zip"
          rm -f "$HXVLC_ZIP"
          ok=0
          for i in 1 2 3 4 5 6; do
            echo "── 第 $i 次尝试下载 hxvlc zip ──"
            if curl -fL --retry 8 --retry-all-errors --retry-delay 5 \
                    -C - --connect-timeout 30 --max-time 2400 \
                    "$HXVLC_URL" -o "$HXVLC_ZIP"; then
              if unzip -tq "$HXVLC_ZIP" >/dev/null 2>&1; then ok=1; break; fi
              echo "!! zip 完整性校验没过，删掉重下"
              rm -f "$HXVLC_ZIP"
            fi
          done
          if [ "$ok" != "1" ]; then echo "### hxvlc zip 下载失败（6 次都断了）"; exit 1; fi
          ls -l "$HXVLC_ZIP"
          echo "## 离线安装 hxvlc"
          haxelib install "$HXVLC_ZIP" --always
          haxelib set hxvlc 1.9.3

          echo "## 可选依赖"
          haxelib remove linc_luajit || true
          haxelib git linc_luajit https://github.com/AndreiRudenko/linc_luajit.git master || echo "skip linc_luajit"
          haxelib git hxShaders https://github.com/JonnycatMeow/hxShaders.git main || echo "skip hxShaders"
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git master || echo "skip discord_rpc"
          haxelib git extension-androidtools https://github.com/MaysLastPlay77/extension-androidtools.git main || echo "skip androidtools"

          # ⚠ 必须在【所有依赖装完】之后把 hxcpp 切回 git fork！
          #   两个 hxcpp 的实际版本号：
          #     · kittycathy233/hxcpp  → 4.3.0（lime 8.2.2 配套，能跑通）
          #     · haxelib 官方        → 4.3.2（会被 hxvlc 的依赖声明拖进来）
          #   hxvlc/haxelib.json 声明了 `hxcpp: 4.3.2`，`haxelib install hxvlc`
          #   会顺手把官方 4.3.2 装上并让它成为默认版本，把 fork 挤掉。
          #   被顶掉后 `haxelib run lime` 会【静默 RC=1、零输出】，
          #   build.log 落到 0 字节 —— 看着像"编译失败"，其实是 lime 根本没起来。
          #
          #   ⚠ 千万【不要】rm -rf "$HAXELIB_ROOT/hxcpp" 再重装：
          #     那样会把 haxelib 的版本注册表搞坏，`haxelib list hxcpp` 只剩
          #     `hxcpp: [git]`（版本号空），lime 更起不来。
          #     正确做法是直接 `haxelib set` 切回已有的 git 版本。
          echo "## 把 hxcpp 切回 git fork（4.3.0）"
          haxelib list hxcpp
          haxelib set hxcpp git || haxelib git hxcpp https://github.com/kittycathy233/hxcpp main
          echo "## hxcpp 现在的实际版本（必须带 4.3.0，不能是空）"
          haxelib list hxcpp
          grep -m1 '"version"' "$HAXELIB_ROOT/hxcpp/git/haxelib.json" || true

          haxelib list

      - name: 自检视频库 hxvlc
        run: |
          set +e
          haxelib path hxvlc
          HV=$(ls -d "$HAXELIB_ROOT/hxvlc/"* 2>/dev/null | head -1)
          grep -m1 'version' "$HV/haxelib.json"
          echo "### forceRendering 是否存在"
          grep -n "forceRendering" "$HV/source/hxvlc/openfl/Video.hx" | head -3
          echo "### FlxVideoSprite 是否使用 ?. 语法（应为空）"
          grep -n '\?\.[a-zA-Z]' "$HV/source/hxvlc/flixel/FlxVideoSprite.hx" || echo "（无，OK）"

      - name: 初始化 lime（iOS）
        run: |
          set +e
          echo "### haxelib 版本"
          haxelib version
          echo "### hxcpp 版本（必须是 4.3.0，不能是空）"
          haxelib list hxcpp
          echo "### lime 位置"
          haxelib path lime
          echo "### lime 目录实际内容"
          ls -la "$HAXELIB_ROOT/lime/" 2>&1 | head -20

          # lime setup 在 iOS 上会问 Xcode 路径这类问题。
          # 之前用 </dev/null 会让它读到 EOF 直接退出（静默 RC=1），
          # 这里用 printf 喂空行（表示"用默认值"）。
          echo "### 跑 lime setup（喂空行用默认值）"
          printf '\n\n\n\n\n' | haxelib run lime setup 2>&1 | tail -30
          echo "lime setup RC=${PIPESTATUS[0]:-?}"

          echo "### lime --version（完整输出，含 stderr）"
          haxelib run lime --version 2>&1
          echo "lime --version RC=$?"

          echo "### lime 的 ndll 是否已生成（关键：lime 自己有没有编译出来）"
          for d in "$HAXELIB_ROOT/lime/git" "$HAXELIB_ROOT/lime"/*; do
            [ -d "$d/ndll" ] && { echo "找到 ndll: $d/ndll"; ls -la "$d/ndll/Mac64" 2>&1 | head; }
          done
          ls -la "$HAXELIB_ROOT/lime/git/ndll/Mac64" 2>/dev/null || echo "!! 没有 ndll/Mac64"

          {
            echo '## iOS：lime 初始化诊断'
            echo '### lime 目录'
            echo '```'
            ls -la "$HAXELIB_ROOT/lime/" 2>&1 | head -20
            echo '```'
            echo '### lime setup'
            echo '```'
            printf '\n\n\n\n\n' | haxelib run lime setup 2>&1 | tail -30
            echo '```'
            echo '### lime --version（含 stderr）'
            echo '```'
            haxelib run lime --version 2>&1 | tail -30
            echo '```'
            echo '### lime ndll'
            echo '```'
            ls -la "$HAXELIB_ROOT/lime/git/ndll/Mac64" 2>&1 | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: 选择 Xcode 版本
        run: |
          set +e
          XCODE_PATH="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1)"
          if [ -n "$XCODE_PATH" ]; then sudo xcode-select -s "$XCODE_PATH/Contents/Developer"; fi
          xcodebuild -version

      - name: 编译 iOS
        id: build
        continue-on-error: true
        run: |
          set +e
          START=$(date +%s)
          haxelib run lime build ios -release -nosign > build.log 2>&1
          RC=$?
          END=$(date +%s)
          echo "lime build RC=$RC  耗时 $((END-START)) 秒  log=$(wc -c < build.log) bytes"
          echo "### 日志里 Compiling 行数（越少说明缓存命中越多）"
          grep -c "Compiling" build.log || true
          tail -60 build.log
          echo "### Haxe 报错行（.hx:行号）###"
          grep -nE '\.hx:[0-9]+' build.log | tail -40
          echo "### 链接报错行 ###"
          grep -nE '^make: \*\*\*|Error [0-9]+$|Undefined symbols|ld: ' build.log | tail -20
          ERR="$(grep -E '\.hx:[0-9]+' build.log | tail -40)"
          if [ -z "$ERR" ]; then ERR="$(tail -25 build.log)"; fi
          printf '%s\n' "$ERR" | sed -e 's/\r//g' -e 's/%/%25/g' | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line:0:900}"
          done
          # 把错误同时贴到摘要页，省得每次都要下几十 MB 日志
          {
            echo "## lime build ios  RC=$RC  用时 $((END-START))s"
            echo ""
            echo '### Haxe 报错（.hx:行号）'
            echo '```'
            grep -E '\.hx:[0-9]+' build.log | tail -25 || echo '(无)'
            echo '```'
            echo '### 链接 / make 报错'
            echo '```'
            grep -E '^make: \*\*\*|Error [0-9]+$|Undefined symbols|ld: |clang' build.log | tail -25 || echo '(无)'
            echo '```'
            echo '### 日志尾部 40 行'
            echo '```'
            tail -40 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          APP=$(find export -maxdepth 8 -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then echo "### 没有 .app 产物 ###"; exit 1; fi
          echo "产物: $APP"
          exit $RC

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lime-build-log
          path: build.log

      - name: 检查编译是否成功
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: 打包成 IPA
        run: |
          set -Eeuo pipefail
          APP=$(find export -maxdepth 8 -name "*.app" -type d | head -n 1)
          echo "产物: $APP"
          du -sh "$APP"
          if [ ! -d "$APP/assets" ]; then echo "!! App 包里没有 assets"; exit 1; fi
          if [ ! -f "$APP/assets/resources.zip" ]; then
            cp -f assets/preload/resources.zip "$APP/assets/resources.zip"
          fi
          find "$APP" -name "*.mp4" -delete || true
          rm -rf Payload *.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          find Payload -exec touch -t 202401010000 {} +
          zip -qry PsychEngine_iOS_unsigned.ipa Payload
          ls -lh *.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine_iOS_unsigned
          path: PsychEngine_iOS_unsigned.ipa
          retention-days: 14

  # ============================================================================
  # Android 构建
  # ============================================================================
  # 与 iOS job 的关系：
  #   · 源码完全相同（同一份 source/，含 hxcodec/VideoHandler.hx 兼容层）
  #   · 目标平台不同 → Project.xml 里 VIDEOS_ALLOWED 已含 android
  #   · 视频后端同为 hxvlc 1.9.3（该版本随库带 Android 的 libvlc-*.so）
  #
  # 工具链：JDK 11 + Android SDK (API 34 + Build-Tools 34) + NDK r15c
  #   ⚠ NDK r15c 是老的，但与本仓库锁定的 hxcpp 以及 Lime 8 的默认工具链匹配，
  #     不要随意升级（新版 NDK 去掉了 gcc、改了 STL 头，hxcpp 会编不过）。
  build-android:
    name: 安卓构建（Ubuntu）
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HAXELIB_ROOT: ${{ github.workspace }}/_haxelib
      HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp-cache

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 恢复仓库自带的素材（assets / example_mods）
        run: |
          set -Eeuo pipefail
          rm -rf assets resources.zip assets/preload/resources.zip mods
          git checkout -f HEAD -- assets
          git checkout -f HEAD -- example_mods
          echo "assets 文件数: $(find assets -type f | wc -l)"

      - name: 修补 Lua：错误的 setProperty 不再让游戏崩溃（只记日志）
        run: |
          set -Eeuo pipefail
          python3 tools/patch_lua_guard.py
          grep -c "LuaGuard" source/FunkinLua.hx || true

      # ⚠ 顺序很关键：setup-android@v3 会拉最新的 cmdline-tools（16.0），
      #   而它【强制要求 JDK 17+】，会直接报
      #   "This tool requires JDK 17 or later. Your version was detected as 11"
      #   并让整个 job 挂掉。
      #   所以先用 runner 自带的 JDK 17 把 SDK 装完，再切回 JDK 11 给 Gradle 用
      #   （Gradle 7.5.1 不支持 17+）。
      - name: 安装安卓 SDK（这一步用系统自带的 JDK 17）
        run: |
          set -Eeuo pipefail
          echo "当前 java: $(java -version 2>&1 | head -1)"
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
        shell: bash

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: 确认安卓 SDK 就绪
        run: |
          set -Eeuo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          ls "${ANDROID_HOME}/platforms" || true
          ls "${ANDROID_HOME}/build-tools" || true

      - name: 切换回 JDK 11（Gradle 7.5.1 只能用 11）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          java-package: jdk

      - name: 确认 JDK 11 已生效
        run: |
          set -Eeuo pipefail
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          # sdkmanager 若被后续步骤调用会再次需要 17，这里禁掉版本检查
          echo "SKIP_JDK_VERSION_CHECK=1" >> "$GITHUB_ENV"

      - name: 安装安卓 NDK r15c
        run: |
          set -Eeuo pipefail
          NDK_URL="https://dl.google.com/android/repository/android-ndk-r15c-linux-x86_64.zip"
          curl -fL --retry 5 --retry-delay 5 -o /tmp/ndk.zip "$NDK_URL"
          ls -lh /tmp/ndk.zip
          mkdir -p "$HOME/android-ndk"
          unzip -q /tmp/ndk.zip -d "$HOME/android-ndk"
          NDK_ROOT="$(find "$HOME/android-ndk" -maxdepth 1 -type d -name 'android-ndk-*' | head -1)"
          echo "NDK_ROOT=$NDK_ROOT"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_ROOT" >> "$GITHUB_ENV"
          ls "$NDK_ROOT" | head

      - name: 安装 Haxe 4.2.4 与 neko
        run: |
          set -Eeuo pipefail
          # ⚠ 必须 4.2.4（不是 4.2.5、更不是 4.3）：
          #   hxvlc 1.9.4+ / 2.x 用了 Haxe 4.3 的 `?.` 语法，4.2.4 编不过；
          #   本项目锁 hxvlc 1.9.3，与 iOS 侧保持同一 Haxe 版本最省心。
          curl -fL --retry 5 --retry-delay 5 -o /tmp/haxe.tar.gz \
            https://github.com/HaxeFoundation/haxe/releases/download/4.2.4/haxe-4.2.4-linux64.tar.gz
          mkdir -p "$HOME/haxe"
          tar -xzf /tmp/haxe.tar.gz -C "$HOME/haxe"
          HAXE_DIR="$(find "$HOME/haxe" -maxdepth 1 -type d -name 'haxe_*' | head -1)"
          echo "$HAXE_DIR" >> "$GITHUB_PATH"
          # neko 运行时（haxelib 需要）
          curl -fL --retry 5 --retry-delay 5 -o /tmp/neko.tar.gz \
            https://github.com/HaxeFoundation/neko/releases/download/v2-3-0/neko-2.3.0-linux64.tar.gz
          mkdir -p "$HOME/neko"
          tar -xzf /tmp/neko.tar.gz -C "$HOME/neko"
          NEKO_DIR="$(find "$HOME/neko" -maxdepth 1 -type d -name 'neko-*' | head -1)"
          echo "$NEKO_DIR" >> "$GITHUB_PATH"
          # ⚠ Linux 上 LD_LIBRARY_PATH 默认是【未定义】的，直接引用会被
          #   `set -u` 判为 unbound variable 而整个步骤失败：
          #     line 18: LD_LIBRARY_PATH: unbound variable
          #   所以这里必须先给默认值。
          echo "LD_LIBRARY_PATH=${NEKO_DIR}:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "NEKOPATH=$NEKO_DIR" >> "$GITHUB_ENV"
          "$HAXE_DIR/haxe" -version
          "$NEKO_DIR/neko" -version

      - name: 配置 haxelib 仓库路径
        run: |
          set -Eeuo pipefail
          mkdir -p "$HAXELIB_ROOT"
          haxelib setup "$HAXELIB_ROOT"
          mkdir -p "$HXCPP_COMPILE_CACHE"
          du -sh "$HXCPP_COMPILE_CACHE" 2>/dev/null || true

      - name: 缓存 haxelib 依赖库
        uses: actions/cache@v4
        with:
          path: _haxelib
          key: psych063-android-haxelib-v1
          restore-keys: |
            psych063-android-haxelib-

      - name: 缓存 hxcpp 编译产物（提速关键）
        uses: actions/cache@v4
        with:
          path: .hxcpp-cache
          key: hxcpp-android-cache-haxe424-v1
          restore-keys: |
            hxcpp-android-cache-haxe424-

      - name: 安装项目依赖（Haxe 库）
        run: |
          set -Eeuo pipefail
          haxelib git lime https://github.com/PsychEngine-report/LIME-0.6.3-FIX main
          haxelib install openfl 9.1.0 --always
          haxelib install flixel 4.11.0 --always
          haxelib install flixel-addons 2.11.0 --always
          haxelib install flixel-ui 2.4.0 --always
          haxelib install hscript 2.4.0 --always
          # ⚠ 必须和 iOS 侧一致用 git 版：这个 fork 才是 lime 8.2.2 配套的那份，
          #   装 haxelib 上的 4.2.1/4.3.2 会让 lime 起不来（表现为
          #   `haxelib run lime` 静默退出、build.log 0 字节）。
          haxelib git hxcpp https://github.com/kittycathy233/hxcpp main

          # hxvlc 1.9.3：唯一同时满足「有 GPU 渲染路径」+「Haxe 4.2.4 语法通过」
          # +「随库带 Android libvlc-.so」的版本。
          #
          # ⚠⚠ 千万不要用 `haxelib install hxvlc 1.9.3` 直接从网上拉！
          #   这个包的 zip 有 212MB（里面塞了 Android/iOS/macOS/Windows 四个
          #   平台的 libvlc 原生库）。haxelib 自带的下载器在 GitHub Actions 的
          #   runner 上会【中途断流且不报错重试】，实测两次分别死在
          #   154MB(69%) 和 106MB(47%)，日志戛然而止、job 直接失败，
          #   看起来像"编译失败"，其实根本没到编译阶段。
          #
          #   改用 curl：--retry-all-errors + -C - 断点续传，
          #   断了能接着下，比 haxelib 内置下载器硬得多。
          #   下完再 `haxelib install <本地zip>` 离线安装。
          echo "## hxvlc 1.9.3（curl 断点续传 + 本地离线安装）"
          HXVLC_ZIP="$RUNNER_TEMP/hxvlc-1.9.3.zip"
          HXVLC_URL="https://lib.haxe.org/files/3.0/hxvlc-1,9,3.zip"
          rm -f "$HXVLC_ZIP"
          ok=0
          for i in 1 2 3 4 5 6; do
            echo "── 第 $i 次尝试下载 hxvlc zip ──"
            if curl -fL --retry 8 --retry-all-errors --retry-delay 5 \
                    -C - --connect-timeout 30 --max-time 2400 \
                    "$HXVLC_URL" -o "$HXVLC_ZIP"; then
              if unzip -tq "$HXVLC_ZIP" >/dev/null 2>&1; then ok=1; break; fi
              echo "!! zip 完整性校验没过，删掉重下"
              rm -f "$HXVLC_ZIP"
            fi
          done
          if [ "$ok" != "1" ]; then echo "### hxvlc zip 下载失败（6 次都断了）"; exit 1; fi
          ls -l "$HXVLC_ZIP"
          echo "## 离线安装 hxvlc"
          haxelib install "$HXVLC_ZIP" --always
          haxelib set hxvlc 1.9.3

          echo "## 可选依赖"
          haxelib remove linc_luajit || true
          haxelib git linc_luajit https://github.com/AndreiRudenko/linc_luajit.git master || echo "skip linc_luajit"
          haxelib git hxShaders https://github.com/JonnycatMeow/hxShaders.git main || echo "skip hxShaders"
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git master || echo "skip discord_rpc"
          haxelib git extension-androidtools https://github.com/MaysLastPlay77/extension-androidtools.git main || echo "skip androidtools"

          # ⚠ 必须在【所有依赖装完】之后把 hxcpp 切回 git fork！
          #   两个 hxcpp 的实际版本号：
          #     · kittycathy233/hxcpp  → 4.3.0（lime 8.2.2 配套，能跑通）
          #     · haxelib 官方        → 4.3.2（会被 hxvlc 的依赖声明拖进来）
          #   hxvlc/haxelib.json 声明了 `hxcpp: 4.3.2`，`haxelib install hxvlc`
          #   会顺手把官方 4.3.2 装上并让它成为默认版本，把 fork 挤掉。
          #   被顶掉后 `haxelib run lime` 会【静默 RC=1、零输出】，
          #   build.log 落到 0 字节 —— 看着像"编译失败"，其实是 lime 根本没起来。
          #
          #   ⚠ 千万【不要】rm -rf "$HAXELIB_ROOT/hxcpp" 再重装：
          #     那样会把 haxelib 的版本注册表搞坏，`haxelib list hxcpp` 只剩
          #     `hxcpp: [git]`（版本号空），lime 更起不来。
          #     正确做法是直接 `haxelib set` 切回已有的 git 版本。
          echo "## 把 hxcpp 切回 git fork（4.3.0）"
          haxelib list hxcpp
          haxelib set hxcpp git || haxelib git hxcpp https://github.com/kittycathy233/hxcpp main
          echo "## hxcpp 现在的实际版本（必须带 4.3.0，不能是空）"
          haxelib list hxcpp
          grep -m1 '"version"' "$HAXELIB_ROOT/hxcpp/git/haxelib.json" || true

          haxelib list

      - name: 自检视频库 hxvlc（确认 Android 原生库在）
        run: |
          set +e
          HV=$(ls -d "$HAXELIB_ROOT/hxvlc/"* 2>/dev/null | head -1)
          echo "hxvlc 目录: $HV"
          grep -m1 'version' "$HV/haxelib.json"
          echo "### include.xml 里的 android 段（应有 ndll vlc / c++_shared）###"
          grep -A4 'section if="android"' "$HV/include.xml"
          echo "### Android 原生库文件 ###"
          ls -lh "$HV/project/vlc/lib/Android/" 2>/dev/null || echo "!! 找不到 Android 库目录"
          echo "### forceRendering 是否存在 ###"
          grep -n "forceRendering" "$HV/source/hxvlc/openfl/Video.hx" | head -3

      # ⚠ lime 8.2.2 内置了 extension-androidtools 的 Java 扩展，直接
      #   <haxelib name="extension-androidtools"/> 会报 "already included"。
      #   但内置那份不带 android.Hardware / android.Tools 这些 Haxe 绑定类，
      #   而源码又必须要 —— 所以把 haxelib 里的 Haxe 源码拷进项目，
      #   用 <classpath path="extension-androidtools/src"/> 挂进来。
      #
      # ⚠ 必须【排除】 src/android/os/Build.hx！
      #   extension-androidtools 里那个 Build 是个只有 791 字节的精简版，
      #   挂进来会把 lime 自带的完整版覆盖掉，于是 lime 自己编译时报：
      #     lime/system/System.hx:943: Class<android.os.Build> has no field VERSION
      - name: 把 extension-androidtools 的 Haxe 源码拷进项目
        run: |
          set -Eeuo pipefail
          ET=$(ls -d "$HAXELIB_ROOT/extension-androidtools/"* 2>/dev/null | head -1)
          echo "haxelib 里的 extension-androidtools: $ET"
          if [ -z "$ET" ] || [ ! -d "$ET/src/android" ]; then
            echo "!! 找不到 $ET/src/android —— hmm 里的 extension-androidtools 没装上"
            exit 1
          fi
          rm -rf extension-androidtools
          mkdir -p extension-androidtools
          cp -R "$ET/src" extension-androidtools/src
          # 干掉精简版 Build，保留 lime 自带的完整版
          rm -f extension-androidtools/src/android/os/Build.hx
          rmdir extension-androidtools/src/android/os 2>/dev/null || true
          echo "### 拷进来的类 ###"
          ls extension-androidtools/src/android/
          echo "### 确认 android/os/Build.hx 已排除 ###"
          ls extension-androidtools/src/android/os/ 2>/dev/null && echo "!! 还在" || echo "已排除，OK"
          {
            echo '### extension-androidtools 源码（已拷入项目）'
            echo '```'
            find extension-androidtools -name '*.hx' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: 初始化 lime（安卓）
        run: |
          set +e
          echo "### hxcpp 版本（必须是 4.3.0，不能是空）"
          haxelib list hxcpp
          echo "### lime 位置"
          haxelib path lime

          # ⚠ 为什么不能简单 `yes | haxelib run lime setup android`：
          #   lime setup 会挨个问 SDK / NDK / JDK 路径，`yes` 只会灌 'y'，
          #   那个 'y' 被当成路径答案存下来 → 报
          #     Error: Cannot find directory "y/build-tools/"
          #
          # ⚠ 为什么也不能只用 `lime config`：
          #   config 只写配置项，不会生成 lime 认的「SDK 已安装」标记 →
          #   报 Error: You need to run "lime setup android" before you can use the Android target
          #
          # 正确做法：用 printf 按顺序喂【真实路径】，把三个问题一次答完。
          echo "### 非交互式跑 lime setup android（喂真实路径）"
          printf '%s\n%s\n%s\n' \
            "$ANDROID_HOME" \
            "$ANDROID_NDK_ROOT" \
            "$JAVA_HOME" \
            | haxelib run lime setup android 2>&1 | tail -30
          echo "lime setup android RC=${PIPESTATUS[0]:-?}"

          echo "### 兜底：再用 lime config 把路径写死一遍"
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME" 2>&1 | tail -3
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT" 2>&1 | tail -3
          haxelib run lime config JAVA_HOME "$JAVA_HOME" 2>&1 | tail -3

          echo "### 确认 lime 配置"
          haxelib run lime config 2>&1 | tee /tmp/lime_cfg.txt | head -40

          echo "### lime --version（完整输出，含 stderr）"
          haxelib run lime --version 2>&1
          echo "lime --version RC=$?"

          echo "### lime 的 ndll（有 .ndll 才说明 lime 自己编译成功了）"
          ls -la "$HAXELIB_ROOT/lime/git/ndll/Linux64" 2>/dev/null \
            || ls -la "$HAXELIB_ROOT/lime"/*/ndll/Linux64 2>/dev/null \
            || echo "!! 找不到 ndll/Linux64"

          {
            echo '## 安卓：lime 初始化诊断'
            echo '### lime config'
            echo '```'
            cat /tmp/lime_cfg.txt 2>/dev/null | head -50
            echo '```'
            echo '### lime --version'
            echo '```'
            haxelib run lime --version 2>&1 | tail -30
            echo '```'
            echo '### lime ndll 目录'
            echo '```'
            ls -la "$HAXELIB_ROOT/lime/git/ndll/Linux64" 2>&1 | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: 编译安卓
        id: build
        continue-on-error: true
        run: |
          set +e
          START=$(date +%s)
          haxelib run lime build android -release > build.log 2>&1
          RC=$?
          END=$(date +%s)
          echo "lime build RC=$RC  耗时 $((END-START)) 秒  log=$(wc -c < build.log) bytes"
          echo "### 日志里 Compiling 行数（越少说明缓存命中越多）"
          grep -c "Compiling" build.log || true
          tail -80 build.log
          echo "### Haxe 报错行（.hx:行号）###"
          grep -nE '\.hx:[0-9]+' build.log | tail -40
          echo "### 原生链接/NDK 报错行 ###"
          grep -nE 'Error [0-9]+$|Undefined symbols|ld: |error:' build.log | tail -30
          ERR="$(grep -E '\.hx:[0-9]+' build.log | tail -40)"
          if [ -z "$ERR" ]; then ERR="$(tail -25 build.log)"; fi
          printf '%s\n' "$ERR" | sed -e 's/\r//g' -e 's/%/%25/g' | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line:0:900}"
          done
          # 贴到摘要页
          {
            echo "## lime build android  RC=$RC  用时 $((END-START))s"
            echo ""
            echo '### Haxe 报错（.hx:行号）'
            echo '```'
            grep -E '\.hx:[0-9]+' build.log | tail -25 || echo '(无)'
            echo '```'
            echo '### NDK / 链接 / javac 报错'
            echo '```'
            grep -E 'Error [0-9]+$|Undefined symbols|ld: |error:|error |FAILURE|Execution failed' build.log | tail -30 || echo '(无)'
            echo '```'
            echo '### 日志尾部 50 行'
            echo '```'
            tail -50 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          APK=$(find export -maxdepth 8 -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then echo "### 没有 .apk 产物 ###"; exit 1; fi
          echo "产物: $APK"
          exit $RC

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lime-build-log-android
          path: build.log

      - name: 检查编译是否成功
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: 整理出 APK 成品
        run: |
          set -Eeuo pipefail
          APK=$(find export -maxdepth 8 -name "*.apk" -type f | head -n 1)
          echo "产物: $APK"
          du -sh "$APK"
          # 确认 hxvlc 的原生库真的打进去了（缺 libvlc.so 会导致一放视频就崩）
          echo "### APK 里的 libvlc / libc++_shared ###"
          unzip -l "$APK" | grep -E 'libvlc|libc\+\+_shared' || echo "!! APK 内找不到 libvlc（视频会崩）"
          cp -f "$APK" PsychEngine_Android_unsigned.apk
          ls -lh PsychEngine_Android_unsigned.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine_Android_unsigned
          path: PsychEngine_Android_unsigned.apk
          retention-days: 14
